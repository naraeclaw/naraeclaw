name: PR Path Labeler (Manual)

# Disabled by default during fast development mode.
# Re-enable pull_request_target when label automation becomes useful again.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  noop:
    name: Labeler disabled
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR path labeler is disabled during fast development mode."
