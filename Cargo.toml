[workspace]
members = [".", "crates/naraeclaw-api", "crates/naraeclaw-infra", "crates/naraeclaw-config", "crates/naraeclaw-providers", "crates/naraeclaw-memory", "crates/naraeclaw-channels", "crates/naraeclaw-tools", "crates/naraeclaw-runtime", "crates/naraeclaw-tui", "crates/naraeclaw-gateway", "crates/naraeclaw-tool-call-parser", "crates/naraeclaw-macros", "apps/tauri"]
resolver = "2"

[workspace.package]
version = "0.6.9"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naraeclaw/naraeclaw"
rust-version = "1.87"

[workspace.dependencies]
naraeclaw-api = { path = "crates/naraeclaw-api", version = "0.6.9" }
naraeclaw-infra = { path = "crates/naraeclaw-infra", version = "0.6.9" }
naraeclaw-config = { path = "crates/naraeclaw-config", version = "0.6.9", default-features = false }
naraeclaw-providers = { path = "crates/naraeclaw-providers", version = "0.6.9" }
naraeclaw-memory = { path = "crates/naraeclaw-memory", version = "0.6.9" }
naraeclaw-channels = { path = "crates/naraeclaw-channels", version = "0.6.9", default-features = false }
naraeclaw-tools = { path = "crates/naraeclaw-tools", version = "0.6.9" }
naraeclaw-runtime = { path = "crates/naraeclaw-runtime", version = "0.6.9", default-features = false }
naraeclaw-tui = { path = "crates/naraeclaw-tui", version = "0.6.9" }
naraeclaw-gateway = { path = "crates/naraeclaw-gateway", version = "0.6.9" }
naraeclaw-tool-call-parser = { path = "crates/naraeclaw-tool-call-parser", version = "0.6.9" }
naraeclaw-macros = { path = "crates/naraeclaw-macros", version = "0.6.9" }

# Memory zeroization for secrets on drop
zeroize = { version = "1", features = ["derive"] }

[package]
name = "naraeclaw"
version.workspace = true
edition.workspace = true
authors = []
license.workspace = true
description = "나래클로 — 한국어 우선 경량 AI 에이전트 런타임. 텔레그램 등 메신저에서 즉시 응답."
repository.workspace = true
readme = "README.md"
keywords = ["ai", "agent", "cli", "assistant", "chatbot"]
categories = ["command-line-utilities", "api-bindings"]
rust-version.workspace = true
include = [
  "/src/**/*",
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/NOTICE",
  "/README.md",
  "/tool_descriptions/**/*",
]

[[bin]]
name = "naraeclaw"
path = "src/main.rs"

[lib]
name = "naraeclaw"
path = "src/lib.rs"

[dependencies]
# Internal workspace crates — versions and paths declared once in [workspace.dependencies]
naraeclaw-api.workspace = true
naraeclaw-infra.workspace = true
naraeclaw-config.workspace = true
naraeclaw-providers.workspace = true
naraeclaw-memory.workspace = true
naraeclaw-channels = { workspace = true, optional = true }
naraeclaw-tools = { workspace = true, optional = true }
naraeclaw-runtime = { workspace = true, optional = true }
naraeclaw-tui = { workspace = true, optional = true }
naraeclaw-gateway = { workspace = true, optional = true }
naraeclaw-tool-call-parser.workspace = true
naraeclaw-macros.workspace = true
# CLI - minimal and fast
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Async runtime - feature-optimized for size
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false, features = ["fs", "sync"] }

# HTTP client - minimal features
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"
toml = "1.0"
shellexpand = "3.1"

# JSON Schema generation for config export
schemars = "1.2"

# Logging - minimal
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

# Base64 encoding (screenshots, image data)
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# URL encoding for web search
urlencoding = "2.1"

# HTML to plain text conversion (web_fetch tool)
nanohtml2text = "0.2"

rumqttc = "0.24"

# Tarball extraction for binary updates
flate2 = "1"
tar = "0.4"

# Progress bars (update pipeline)
indicatif = "0.18"

# Temp files (update pipeline rollback)
tempfile = "3.26"

# Zip extraction for ClawhHub / OpenClaw registry installers
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"


# UUID generation
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

# Authenticated encryption (AEAD) for secret store
chacha20poly1305 = "0.10"

# HMAC for webhook signature verification
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# CSPRNG for secure token generation
rand = "0.10"

# Portable atomic fallbacks for targets without native 64-bit atomics
portable-atomic = "1"

# Fast mutexes that don't poison on panic
parking_lot = "0.12"

# Async traits
async-trait = "0.1"

# HMAC-SHA256 (Zhipu/GLM JWT auth)
ring = { version = "0.17", optional = true }

# LRU cache for bounded sender state
lru = { version = "0.16", optional = true }

# Memory / persistence (migration.rs, behind agent-runtime)
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10", optional = true }
cron = { version = "0.15", optional = true }

# Interactive CLI prompts (memory CLI uses dialoguer unconditionally)
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"

# TUI onboarding (ratatui + crossterm)
ratatui = { version = "0.30", default-features = true, optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }


# Binary discovery (init system detection)
which = { version = "8.0", optional = true }

# WebSocket client (gateway)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
tokio-socks = { version = "0.5", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
regex = "1.10"
hostname = { version = "0.4.2", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = { version = "1.14.0", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
webpki-roots = { version = "1.0.6", optional = true }

# HTTP server (gateway) — replaces raw TCP for proper HTTP/1.1 compliance
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout"], optional = true }
http-body-util = { version = "0.1", optional = true }

# rust-embed removed — web dashboard served from filesystem via gateway.web_dist_dir
mime_guess = { version = "2", optional = true }

# Use the blocking HTTP exporter client to avoid Tokio-reactor panics in
# non-Tokio contexts.


# Uses wa-rs for Bot and Client, wa-rs-core for storage traits, custom rusqlite backend avoids Diesel conflict.

# Unix-specific dependencies (for root check, etc.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = [
    "agent-runtime",
    "observability-prometheus",
    "schema-export",
]

# The default agent runtime — agent loop, core channels, tools, gateway, TUI.
# Without this, you get the kernel: config + providers + memory + CLI chat.
agent-runtime = [
    "dep:naraeclaw-runtime", "dep:naraeclaw-channels", "dep:naraeclaw-tools",
    "dep:rusqlite",
    "dep:ring", "dep:lru", "dep:chrono-tz", "dep:cron", "dep:which",
    "dep:ratatui", "dep:crossterm",
    "dep:tokio-tungstenite", "dep:tokio-socks", "dep:hostname",
    "dep:rustls", "dep:rustls-pemfile", "dep:rustls-pki-types", "dep:tokio-rustls", "dep:webpki-roots",
    "dep:axum", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:tower-http", "dep:http-body-util",
    "dep:mime_guess",
    "gateway", "tui-onboarding",
    "channel-webhook", "channel-acp-server",
]

# Major subsystems — each forwards to exactly ONE crate
gateway = ["dep:naraeclaw-gateway"]
tui-onboarding = ["dep:naraeclaw-tui"]
schema-export = ["naraeclaw-config/schema-export"]

# Channels — each forwards directly to naraeclaw-channels (1 hop)
channel-webhook = ["naraeclaw-channels/channel-webhook"]
channel-acp-server = ["naraeclaw-channels/channel-acp-server"]

# Bundle alias for future expansion
channels-full = ["agent-runtime"]

# Backends and platform flags — each forwards to ONE crate
observability-prometheus = ["naraeclaw-runtime/observability-prometheus"]
observability-otel = ["naraeclaw-runtime/observability-otel"]
sandbox-landlock = ["naraeclaw-runtime/sandbox-landlock"]
sandbox-bubblewrap = ["naraeclaw-runtime/sandbox-bubblewrap"]
browser-native = ["naraeclaw-tools/browser-native"]
rag-pdf = ["naraeclaw-tools/rag-pdf"]
webauthn = ["naraeclaw-runtime/webauthn"]

# Backward-compatible aliases
fantoccini = ["browser-native"]
landlock = ["sandbox-landlock"]
metrics = ["observability-prometheus"]

# CI meta-feature
ci-all = [
    "channels-full",
    "observability-prometheus", "observability-otel",
    "sandbox-landlock", "sandbox-bubblewrap",
    "browser-native", "rag-pdf",
    "webauthn",
]

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"      # Optimize for size
lto = "fat"          # Maximum cross-crate optimization for smaller binaries
codegen-units = 1    # Serialized codegen for smaller release binaries
                     # Higher values (e.g., 8) compile faster but may produce larger binaries
strip = true          # Remove debug symbols
panic = "abort"      # Reduce binary size

[profile.release-fast]
inherits = "release"
codegen-units = 8    # Parallel codegen for faster builds on powerful machines (16GB+ RAM recommended)
                     # Use: cargo build --profile release-fast

[profile.ci]
inherits = "release"
lto = "thin"         # Much faster than fat LTO; still catches release-mode issues
codegen-units = 16   # Full parallelism for CI runners

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.26"
wiremock = "0.6"
scopeguard = "1.2"
rcgen = "0.13"

[[test]]
name = "component"
path = "tests/test_component.rs"

[[test]]
name = "integration"
path = "tests/test_integration.rs"
