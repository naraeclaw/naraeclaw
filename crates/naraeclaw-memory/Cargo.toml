[package]
name = "naraeclaw-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory backends, embeddings, consolidation, and retrieval for NaraeClaw."
publish = false

[dependencies]
naraeclaw-api.workspace = true
naraeclaw-config = { workspace = true, default-features = true }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "__rustls-ring"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
hex = "0.4"
sha2 = "0.11"
tokio = { version = "1.52", default-features = false, features = ["fs", "sync", "time"] }
tracing = { version = "0.1", default-features = false }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
