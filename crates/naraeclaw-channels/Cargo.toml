[package]
name = "naraeclaw-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Channel implementations for NaraeClaw (CLI + webhook)."
publish = false

[dependencies]
naraeclaw-api.workspace = true
naraeclaw-infra.workspace = true
naraeclaw-config = { workspace = true, default-features = true }
naraeclaw-memory.workspace = true
naraeclaw-providers.workspace = true
naraeclaw-runtime.workspace = true
naraeclaw-tools.workspace = true
anyhow = "1.0"
lru = "0.17"
rumqttc = "0.25"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hmac = "0.13"
parking_lot = "0.12"
portable-atomic = "1"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "__rustls-ring", "multipart", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.14.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.11"
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "fs", "signal"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", default-features = false }
toml = "1.0"
tracing = { version = "0.1", default-features = false }
urlencoding = "2.1"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }
hex = "0.4"
subtle = "2"
rand = "0.10"
webpki-roots = "1.0.6"
tokio-socks = "0.5"
shellexpand = "3.1"

[features]
default = ["channel-webhook", "channel-acp-server"]
channel-webhook = []
channel-acp-server = []

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3.26"
toml = "1.0"
wiremock = "0.6"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
