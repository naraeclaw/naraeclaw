workspace_dir = "/naraeclaw-data/workspace"
config_path = "/naraeclaw-data/.naraeclaw/config.toml"
# API key: set via .env or environment variable at runtime
api_key = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "llama3.2"
default_temperature = 0.7

[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false

[agent]
max_tool_iterations = 50
max_tool_result_chars = 50000
max_context_tokens = 32000

[agent.context_compression]
enabled = true
tool_result_retrim_chars = 2000

[memory]
backend = "none"
auto_save = false
hygiene_enabled = false
archive_after_days = 7
purge_after_days = 30
embedding_provider = "none"

[knowledge]
enabled = true
provider = "byoridb"
byoridb_home = "~/.byoridb"
required = false

[autonomy]
level = "supervised"
auto_approve = ["file_read", "file_write", "file_edit", "tool_search", "byoridb__memory_recall", "byoridb__memory_read", "byoridb__memory_remember", "byoridb__memory_wiki_upsert", "web_search_tool", "web_fetch", "calculator", "glob_search", "content_search", "image_info", "git_operations"]
